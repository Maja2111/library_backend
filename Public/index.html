<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Biliothek</title>
  </head>
  <body>
    <h1>Willkommen in der Bibliothek</h1>
    <div id="root"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/react@latest/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/react-dom@latest/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script type="module" src="App.js"></script>
    <script>
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
